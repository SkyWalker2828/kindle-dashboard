name: Build Dashboard

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install Pillow requests icalendar
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Render dashboard
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: python dashboard.py
    
      - name: Diagnose calendar
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from icalendar import Calendar

          url = os.environ["CALENDAR_ICAL_URL"]
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "KindleDashboard/1.0"},
          )

          data = urllib.request.urlopen(req, timeout=15).read()
          cal = Calendar.from_ical(data)

          events = []
          for component in cal.walk("VEVENT"):
              summary = str(component.get("SUMMARY", "")).strip()
              dtstart = component.get("DTSTART")
              if summary and dtstart:
                  events.append(dtstart.dt)

          print("CALENDAR_BYTES:", len(data))
          print("CALENDAR_EVENTS:", len(events))
          from datetime import date, datetime
          today = date(2026, 9, 27)
          future = []
          for event_date in events:
              d = event_date.date() if isinstance(event_date, datetime) else event_date
              if d >= today:
                  future.append(event_date)

          print("EVENTS_ON_OR_AFTER_2026_09_27:", len(future))
          for event_date in future[:20]:
              print("FUTURE_EVENT_DATE:", event_date)

          recurring = []
          for component in cal.walk("VEVENT"):
              summary = str(component.get("SUMMARY", "")).strip()
              rrule = component.get("RRULE")
              if summary and rrule:
                  recurring.append((summary, rrule.to_ical().decode("utf-8")))
          print("RECURRING_EVENTS:", len(recurring))
          for summary, rule in recurring[:20]:
              print("RRULE_EVENT:", summary)
              print("RRULE:", rule)
          PY
      
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard.png dashboard-kindle.png
          git diff --staged --quiet && exit 0
          git commit -m "Update dashboard"
          git pull --rebase origin main
          git push origin main
