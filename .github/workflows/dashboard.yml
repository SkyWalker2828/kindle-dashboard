name: Build Dashboard

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install Pillow requests icalendar python-dateutil
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Render dashboard
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: python dashboard.py
    
      - name: Diagnose calendar
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from icalendar import Calendar

          url = os.environ["CALENDAR_ICAL_URL"]
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "KindleDashboard/1.0"},
          )

          data = urllib.request.urlopen(req, timeout=15).read()
          cal = Calendar.from_ical(data)

          events = []
          for component in cal.walk("VEVENT"):
              summary = str(component.get("SUMMARY", "")).strip()
              dtstart = component.get("DTSTART")
              if summary and dtstart:
                  events.append(dtstart.dt)

          print("CALENDAR_BYTES:", len(data))
          print("CALENDAR_EVENTS:", len(events))
          from datetime import date, datetime
          today = date(2026, 9, 27)
          future = []
          for event_date in events:
              d = event_date.date() if isinstance(event_date, datetime) else event_date
              if d >= today:
                  future.append(event_date)

          print("EVENTS_ON_OR_AFTER_2026_09_27:", len(future))
          for event_date in future[:20]:
              print("FUTURE_EVENT_DATE:", event_date)

          recurring = []
          for component in cal.walk("VEVENT"):
              summary = str(component.get("SUMMARY", "")).strip()
              rrule = component.get("RRULE")
              if summary and rrule:
                  recurring.append((summary, rrule.to_ical().decode("utf-8")))
          print("RECURRING_EVENTS:", len(recurring))
          for summary, rule in recurring[:20]:
              print("RRULE_EVENT:", summary)
              print("RRULE:", rule)

          print("=== NEXT 7 DAYS FROM RECURRING EVENTS ===")
          from dateutil.rrule import rrulestr
          from datetime import datetime, timedelta, timezone

          window_start = datetime(2026, 9, 27, tzinfo=timezone.utc)
          window_end = window_start + timedelta(days=7)
          recurring_hits = []

          for component in cal.walk("VEVENT"):
              summary = str(component.get("SUMMARY", "")).strip()
              dtstart = component.get("DTSTART")
              rrule = component.get("RRULE")
              if not summary or not dtstart or not rrule:
                  continue

              start = dtstart.dt
              if isinstance(start, datetime):
                  if start.tzinfo is None:
                      start = start.replace(tzinfo=timezone.utc)
                  rule_text = rrule.to_ical().decode("utf-8")
                  try:
                      rule = rrulestr(rule_text, dtstart=start)
                      for occurrence in rule.between(window_start, window_end, inc=True):
                          recurring_hits.append((occurrence, summary))
                  except Exception as e:
                      print("RRULE_ERROR:", summary, type(e).__name__)

          print("RECURRING_OCCURRENCES_NEXT_7_DAYS:", len(recurring_hits))
          for occurrence, summary in sorted(recurring_hits)[:30]:
              print("RECURRING_OCCURRENCE:", occurrence, "|", summary)
          PY
      
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard.png dashboard-kindle.png
          git diff --staged --quiet && exit 0
          git commit -m "Update dashboard"
          git pull --rebase origin main
          git push origin main
